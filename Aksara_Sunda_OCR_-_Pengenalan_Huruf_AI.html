        html {
            background: #04120f;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
            background: #04120f;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            position: relative;
            overflow-x: hidden;
        }

        /* Latar: gambar naskah aksara (desktop) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(4,18,15,0.55) 0%, rgba(4,18,15,0.15) 55%, rgba(4,18,15,0) 100%),
                var(--bg-desktop) center right / cover no-repeat;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
        }



        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #d6e2ee;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .description {
            color: #c3d0dc;
            font-size: 14px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .upload-area {
            border: 3px dashed #d4af37;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(212, 175, 55, 0.05);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #f4e4c1;
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .upload-text {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
            color: #1a3a3a;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .secondary-btn {
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .secondary-btn:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            margin-top: 30px;
            display: none;
        }

        .preview-section.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-box {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e0e0e0;
        }

        .preview-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .preview-text {
            background: white;
            padding: 12px;
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            font-family: 'Courier New', monospace;
            border: 1px solid #e0e0e0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .run-btn {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
            color: #1a3a3a;
        }

        .run-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .download-btn {
            background: #4CAF50;
            color: white;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .clear-btn {
            background: #f44336;
            color: white;
        }

        .clear-btn:hover {
            background: #da190b;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            border-left: 4px solid #c62828;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            border-left: 4px solid #2e7d32;
        }

        .success.show {
            display: block;
        }

        /* Desktop lebar: kartu di kiri agar naskah di kanan tetap terlihat */
        @media (min-width: 1100px) {
            body { justify-content: flex-start; padding-left: 6vw; }
            .container { max-width: 760px; }
            .header { text-align: left; }
            .logo { justify-content: flex-start; }
            .main-card { background: rgba(255, 255, 255, 0.93); }
        }

        .upload-btn, .secondary-btn { touch-action: manipulation; }
        .upload-area .upload-btn, .upload-area .secondary-btn { margin: 5px; }
        .preview-image { height: auto; }
        .preview-text { overflow-wrap: anywhere; white-space: pre-wrap; }
        .action-btn { min-height: 46px; }

        /* Tablet & HP */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: max(16px, env(safe-area-inset-top));
            }
            body::before {
                background:
                    linear-gradient(180deg, rgba(4,18,15,0.78) 0%, rgba(4,18,15,0.62) 50%, rgba(4,18,15,0.85) 100%),
                    var(--bg-mobile) center / cover no-repeat;
            }
            .header { margin-bottom: 24px; }
            .main-card { padding: 24px 16px; border-radius: 16px; }
            .preview-container { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .logo { font-size: 24px; }
            .logo-icon { width: 36px; height: 36px; font-size: 20px; }
            .upload-area { padding: 28px 16px; border-width: 2px; }
            .upload-text { font-size: 16px; }
            .upload-icon { font-size: 40px; }
            .upload-btn, .secondary-btn { display: block; width: 100%; margin: 8px 0 0; padding: 14px 20px; font-size: 15px; }
            .preview-image { max-height: 260px; }
            .preview-text { max-height: 240px; font-size: 13px; }
        }

        /* HP kecil */
        @media (max-width: 380px) {
            body { padding-left: 12px; padding-right: 12px; }
            .logo { font-size: 21px; }
            .subtitle { font-size: 14px; }
            .description { font-size: 13px; }
        }

        /* HP mode landscape */
        @media (max-height: 500px) and (orientation: landscape) {
            body { align-items: flex-start; }
            .header { margin-bottom: 16px; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🔍</div>
                <div class="logo-text">Aksara Sunda OCR</div>
            </div>
            <div class="subtitle">Pengenalan Aksara dengan AI</div>
            <div class="description">Unggah gambar aksara Sunda dan biarkan AI mengenalinya secara otomatis</div>
        </div>

        <div class="main-card">
            <div class="upload-area" id="uploadArea">
                <span class="upload-icon">📄</span>
                <div class="upload-text">Pilih atau Seret Gambar Aksara Sunda</div>
                <div class="upload-hint">Dukung format: JPG, PNG, WebP</div>
                <button class="upload-btn" id="uploadBtn">Pilih Gambar</button>
                <button class="secondary-btn" id="pasteBtn">Tempel dari Clipboard</button>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="status-text" id="statusText">Memproses gambar...</div>
            </div>

            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <div class="preview-section" id="previewSection">
                <div class="preview-container">
                    <div class="preview-box">
                        <div class="preview-label">📸 Gambar Asli</div>
                        <img id="previewImage" class="preview-image" alt="Preview">
                    </div>
                    <div class="preview-box">
                        <div class="preview-label">📝 Hasil Pengenalan</div>
                        <div class="preview-text" id="previewText">Menunggu pemrosesan...</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn run-btn" id="runBtn">🚀 Jalankan OCR</button>
                    <button class="action-btn download-btn" id="downloadBtn">⬇️ Unduh PDF</button>
                    <button class="action-btn clear-btn" id="clearBtn">🗑️ Bersihkan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedImage = null;
        let recognizedText = '';

        const uploadArea = document.getElementById('uploadArea');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const previewText = document.getElementById('previewText');
        const runBtn = document.getElementById('runBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const statusText = document.getElementById('statusText');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const pasteBtn = document.getElementById('pasteBtn');

        // Upload button click
        uploadBtn.addEventListener('click', () => uploadInput.click());

        // File input change
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImageFile(file);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files[0]) handleImageFile(files[0]);
        });

        // Paste from clipboard
        pasteBtn.addEventListener('click', async () => {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        const blob = await item.getType(item.type);
                        handleImageFile(blob);
                        return;
                    }
                }
                showError('Tidak ada gambar di clipboard');
            } catch (e) {
                showError('Gagal mengakses clipboard: ' + e.message);
            }
        });

        function handleImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImage = e.target.result;
                previewImage.src = selectedImage;
                previewText.textContent = 'Siap untuk diproses...';
                previewSection.classList.add('show');
                errorDiv.classList.remove('show');
                successDiv.classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        runBtn.addEventListener('click', async () => {
            if (!selectedImage) {
                showError('Pilih gambar terlebih dahulu');
                return;
            }
            await processImage();
        });

        async function processImage() {
            loading.classList.add('show');
            previewText.textContent = 'Memproses...';

            try {
                statusText.textContent = 'Mengirim ke AI untuk analisis...';
                
                const base64Image = selectedImage.split(',')[1];
                const mediaType = (selectedImage.match(/^data:(image\/[a-z+.-]+);/i) || [])[1] || 'image/jpeg';
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 1500,
                        messages: [
                            {
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: mediaType,
                                            data: base64Image
                                        }
                                    },
                                    {
                                        type: 'text',
                                        text: `Analisis gambar ini dan lakukan hal berikut:
1. Identifikasi semua aksara/huruf yang terlihat dalam gambar
2. Transkripsi teks yang terlihat (jika ada)
3. Jelaskan jenis aksara yang digunakan
4. Berikan terjemahan atau arti jika memungkinkan

Format respons:
AKSARA TERIDENTIFIKASI:
[list aksara]

TRANSKRIPSI:
[teks yang dikenali]

JENIS AKSARA:
[penjelasan]

ANALISIS LANJUTAN:
[penjelasan tambahan]`
                                    }
                                ]
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error('API error: ' + response.statusText);
                }

                const data = await response.json();
                recognizedText = data.content[0].text;
                previewText.textContent = recognizedText;
                
                loading.classList.remove('show');
                showSuccess('Pengenalan berhasil! PDF siap untuk diunduh.');
                
            } catch (error) {
                loading.classList.remove('show');
                showError('Error: ' + error.message);
                previewText.textContent = 'Gagal memproses gambar. Silakan coba lagi.';
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (!recognizedText) {
                showError('Jalankan OCR terlebih dahulu');
                return;
            }
            generatePDF();
        });

        function generatePDF() {
            try {
                statusText.textContent = 'Membuat PDF...';
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 800;
                const ctx = canvas.getContext('2d');

                // Background
                ctx.fillStyle = '#1a3a3a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Gold accent
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(0, 0, canvas.width, 15);

                // Title
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Hasil OCR Aksara Sunda', canvas.width / 2, 60);

                // Date
                ctx.fillStyle = '#b0c4de';
                ctx.font = '12px Arial';
                const now = new Date().toLocaleDateString('id-ID');
                ctx.fillText('Tanggal: ' + now, canvas.width / 2, 85);

                // Content
                ctx.fillStyle = '#e8e8e8';
                ctx.font = '12px Arial';
                ctx.textAlign = 'left';
                
                const lines = recognizedText.split('\n');
                let y = 120;
                const lineHeight = 18;
                const margin = 40;
                const maxWidth = canvas.width - (margin * 2);

                lines.forEach(line => {
                    if (y > canvas.height - 40) return;
                    ctx.fillText(line, margin, y);
                    y += lineHeight;
                });

                // Footer
                ctx.fillStyle = '#d4af37';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Dibuat dengan Aksara Sunda OCR - AI Powered', canvas.width / 2, canvas.height - 10);

                // Convert to image and create PDF-like download
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `aksara_sunda_ocr_${Date.now()}.png`;
                link.click();

                showSuccess('Gambar PDF berhasil diunduh!');
            } catch (error) {
                showError('Gagal membuat PDF: ' + error.message);
            }
        }

        clearBtn.addEventListener('click', () => {
            selectedImage = null;
            recognizedText = '';
            uploadInput.value = '';
            previewSection.classList.remove('show');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
        });

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        function showSuccess(message) {
            successDiv.textContent = '✅ ' + message;
            successDiv.classList.add('show');
            setTimeout(() => successDiv.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
